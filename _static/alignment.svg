<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-labelledby="title desc"><title id="title">Bilateral partial graph alignment</title><desc id="desc">Three shared vertex pairs are connected across two graphs. Each graph also contains a private vertex.</desc><rect x="1" y="1" width="678" height="278" rx="5" fill="#f7fafc" stroke="#dbe5eb"/><g font-family="Arial,sans-serif" font-size="17" fill="#294657"><text x="129" y="35">Source graph</text><text x="438" y="35">Target graph</text></g><g fill="none" stroke="#9db3c0" stroke-width="2"><path d="M132 91 208 140 132 191 81 140 132 91M208 140 132 191M472 91 548 140 472 191 421 140 472 91M548 140 472 191"/></g><g stroke="#4c93b2" stroke-width="2" stroke-dasharray="6 6" opacity=".85"><path d="M148 91 456 91M224 140C310 105 450 105 532 140M148 191 456 191"/></g><g fill="#246c8d" stroke="white" stroke-width="2"><circle cx="132" cy="91" r="17"/><circle cx="208" cy="140" r="17"/><circle cx="132" cy="191" r="17"/><circle cx="472" cy="91" r="17"/><circle cx="548" cy="140" r="17"/><circle cx="472" cy="191" r="17"/></g><g fill="#fff1dd" stroke="#cc9248" stroke-width="2"><circle cx="81" cy="140" r="17"/><circle cx="421" cy="140" r="17"/></g><g font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="white"><text x="132" y="96">a</text><text x="208" y="145">b</text><text x="132" y="196">c</text><text x="472" y="96">a′</text><text x="548" y="145">b′</text><text x="472" y="196">c′</text></g><g font-family="Arial,sans-serif" font-size="13" fill="#8a5b20" text-anchor="middle"><text x="81" y="145">p</text><text x="421" y="145">q</text></g><g font-family="Arial,sans-serif" font-size="13" fill="#4f6572"><circle cx="194" cy="247" r="6" fill="#246c8d"/><text x="208" y="252">Shared vertex</text><circle cx="340" cy="247" r="6" fill="#fff1dd" stroke="#cc9248"/><text x="354" y="252">Private vertex</text><path d="M468 247h27" stroke="#4c93b2" stroke-width="2" stroke-dasharray="4 3"/><text x="505" y="252">R